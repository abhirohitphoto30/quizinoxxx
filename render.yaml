services:
  - type: web
    name: abhishek-tools-hub
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: node build.js
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
